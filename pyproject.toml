[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition_app"
description = "Application to count your everyday calories."
authors = [
    {name = "Jakub Pietrzak"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
version = "0.0.2"

dependencies = ["python-dotenv"]

[project.optional-dependencies]

test = ["pytest", "pytest-cov"]

code-check = ["black"]

dev = [
    "nutrition_app[test]",
    "nutrition_app[code-check]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nutrition_app*"]
namespaces = false

[tool.black]
line-length = 120

[tool.coverage.run]
omit = ["nutrition_app/app_in_tkinter/*.py"]